name: deploy-referee

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Deployment must not be able to ship code that the tests reject. ci.yml runs
  # the same gates on push, but a separate workflow cannot express `needs`, so
  # the gates are repeated here rather than trusting that ci happened to pass.
  python-gate:
    name: python gate (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: python -m ruff check referee_core tests
      - name: pytest
        run: python -m pytest

  typescript-gate:
    name: typescript gate (tsc + bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bunx tsc --noEmit
      - name: test
        run: bun test

  build-and-deploy:
    needs: [python-gate, typescript-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # Provenance travels inside the package: /health reports this value, so a
      # probe can tell a stale instance from the commit that was deployed.
      - name: Stamp the build SHA
        run: printf 'BUILD_SHA = "%s"\n' "$GITHUB_SHA" > referee_core/_build.py

      # Package the Python core the same way terraform's user_data expects it.
      - name: Build deployment bundle
        run: |
          rm -rf bundle && mkdir bundle
          cp pyproject.toml bundle/
          cp -r referee_core bundle/
          cd bundle && zip -r ../referee.zip . && cd ..

      - name: Upload bundle to S3
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: aws s3 cp referee.zip "s3://${DEPLOY_BUCKET}/referee.zip"

      # Reconciled with terraform (EC2 + systemd): pull + reinstall + restart.
      - name: Deploy to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -eux","cd /opt/referee","aws s3 cp s3://'${{ vars.DEPLOY_BUCKET }}'/referee.zip referee.zip","unzip -o referee.zip","python3.12 -m pip install --upgrade pip","python3.12 -m pip install .","systemctl restart referee"]' \
            --wait
